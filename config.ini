[SIP]
# SIP server (registrar) address
registrar = sip:your_sip_provider.com
# Your SIP account username
username = your_username
# Your SIP account password
password = your_sip_password
# SIP realm (often '*' or the domain part of the registrar)
realm = *

[API_KEYS]
# Your OpenAI API key for Whisper STT
openai_api_key = sk-YOUR_OPENAI_API_KEY
# Your Google AI Studio API key for Gemini
gemini_api_key = YOUR_GOOGLE_GEMINI_API_KEY

[AUDIO]
# Sample rate used for audio processing (MUST match VAD and be acceptable for Whisper)
# Common values: 8000, 16000 (preferred for Whisper), 32000
sample_rate = 16000

[VAD]
# Voice Activity Detection aggressiveness (0=least aggressive, 3=most aggressive filtering non-speech)
aggressiveness = 1
# Frame duration for VAD processing in milliseconds (must be 10, 20, or 30)
frame_ms = 30
# How many milliseconds of silence triggers the end of speech detection
silence_padding_ms = 300
# Minimum milliseconds of speech required before considering it actual speech (filters short noises)
speech_min_ms = 150

[CSV_PATHS]
# Path to the company directory CSV file
directory = company_directory.csv
# Path to the cost sheet CSV file
costs = cost_sheet.csv
# Path to the lead time calculation CSV file
lead_times = lead_time_sheet.csv

[TRANSFER]
# Default SIP URI to transfer calls to if Gemini doesn't specify one
# Example: sip:sales@your_company.com or sip:1001@your_sip_provider.com
default_target_uri = sip:quotes@your_sip_provider.com

[PROMPTING]
# System prompt to guide the Gemini model's behavior and persona
system_prompt = """You are an AI assistant for 'ACME Manufacturing'. Your goal is to provide helpful initial information to callers.
- Be polite, professional, and slightly formal.
- Use your tools to look up employee contacts, estimated part costs, and estimated lead times when asked.
- IMPORTANT: Always state that costs and lead times provided are ESTIMATES ONLY and subject to change based on final specifications and workload.
- Explain that a formal quote requires the caller to submit detailed specifications, such as technical drawings (PDF, STEP), required materials, surface finish, tolerances, and quantities. They can email this to quotes@acmemanufacturing.com.
- When looking up information (costs, lead times, contacts), summarize the key details naturally in your response. Do not just read out the raw data.
- If asked for a specific employee and you find them using the 'lookup_employee' tool, confirm if the caller wants to be transferred. If they agree, end your response with the special tag like [TRANSFER:sip:target@domain.com] provided by the tool.
- If a request is too complex for an estimate (e.g., highly custom part without specs), explain politely that you need more details for a quote and offer to transfer them to the 'Quotes' department (use the directory tool to find their contact info and generate the transfer tag) or provide the quote request email address.
- Keep your spoken responses reasonably concise for a phone call. Avoid very long paragraphs.
- If a tool fails to find the requested information, apologize and state that you couldn't find the specific details.
- If the caller seems frustrated or the request is clearly outside your scope, offer to transfer them to a general support line or the relevant department. Use the default transfer target if unsure.
"""
